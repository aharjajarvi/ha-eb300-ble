# Strict typing applies to the vendored BLE library only. The Home Assistant
# glue in custom_components/eb300_ble/*.py is verified instead by tests/ha,
# which imports every module against a real `homeassistant` package — the one
# check that catches HA moving a helper between releases.
#
# No mypy_path is needed: the library's internal imports are all relative, so
# it type-checks in place as `eb300_ble.eb300_ble`.
[mypy]
python_version = 3.12
strict = True
files = custom_components/eb300_ble/eb300_ble

# The parent package __init__.py imports homeassistant, which is deliberately
# absent from this environment.
[mypy-eb300_ble]
follow_imports = skip
ignore_errors = True
