name: Feature request
description: Suggest something the integration should do
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like it to do?
    validations:
      required: true
  - type: textarea
    id: protocol
    attributes:
      label: Is this supported by the Open API?
      description: |
        If you know the relevant PID or section of Ebeco's Open Local API
        document, name it. Some device functions are reserved for Ebeco's own
        apps and simply cannot be reached over this channel.
